<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>BookNook — Track your reading, revisit what you love</title>
    <meta
      name="description"
      content="BookNook is a cozy reading tracker. Catalog your books, log reading sessions, save quotes and notes, visualize your habits, and dig deeper into the stories you love."
    />
    <meta name="theme-color" content="#C05D22" />
    <link rel="canonical" href="https://book-tracker-ivory.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookNook" />
    <meta property="og:title" content="BookNook — Track your reading, revisit what you love" />
    <meta
      property="og:description"
      content="A cozy reading tracker. Catalog books, log sessions, save quotes, and visualize your reading habits."
    />
    <meta property="og:url" content="https://book-tracker-ivory.vercel.app/" />
    <meta property="og:image" content="https://book-tracker-ivory.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BookNook — track your reading, revisit what you love" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookNook — Track your reading, revisit what you love" />
    <meta
      name="twitter:description"
      content="A cozy reading tracker. Catalog books, log sessions, save quotes, and visualize your reading habits."
    />
    <meta name="twitter:image" content="https://book-tracker-ivory.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
